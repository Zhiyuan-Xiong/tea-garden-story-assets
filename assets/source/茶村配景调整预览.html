</style><main><h1>茶村配景与入口竖牌</h1><p>草丛放大为连贯的叶团，集中在建筑两侧与树根周围；树木与底座留出距离，中间入口和步道保持通畅。建筑略微放大，三个入口换成圆徽、金边与竖排文字。</p><nav><a href="茶树生长阶段调整预览.html">新版茶树</a><a href="茶村自由布置预览.html">新增植物与自由布置</a><a href="素材库预览.html">素材库</a><a href="游戏内调整预览.html">其他游戏画面</a><a href="11_Godot项目/茶园物语/docs/茶村配景与入口调整/生成提示词与素材清单.json">素材与生成提示词</a><a href="11_Godot项目/茶园物语/docs/茶村配景与入口调整/实际渲染与交互检查.json">游戏内检查结果</a></nav><div class="controls"><button id="after" aria-pressed="true">调整后</button><button id="before" aria-pressed="false">调整前</button><button id="zoom" aria-pressed="false">放大建筑局部</button></div><div class="scene" id="scene"><img id="picture" src="11_Godot项目/茶园物语/docs/茶村配景与入口调整/village.png" alt="茶村调整后的实际游戏画面"></div><p class="check">圆徽竖牌可点击进入对应空间，悬停显示采摘、制茶和待客状态。配景为独立透明素材；当前背景循环播放方式保持不变。</p><div class="assets"><article class="asset"><a href="11_Godot项目/茶园物语/assets/15_茶村配景与入口/DEC_451_淡彩水墨松树_v001.png" target="_blank"><img loading="lazy" src="11_Godot项目/茶园物语/assets/15_茶村配景与入口/DEC_451_淡彩水墨松树_v001.png" alt="淡彩水墨松树"></a><p>淡彩水墨松树</p></article><article class="asset"><a href="11_Godot项目/茶园物语/assets/15_茶村配景与入口/DEC_452_淡彩水墨杂树_v001.png" target="_blank"><img loading="lazy" src="11_Godot项目/茶园物语/assets/15_茶村配景与入口/DEC_452_淡彩水墨杂树_v001.png" alt="淡彩水墨杂树"></a><p>淡彩水墨杂树</p></article><article class="asset"><a href="11_Godot项目/茶园物语/assets/15_茶村配景与入口/DEC_455_连贯低矮叶团_v002.png" target="_blank"><img loading="lazy" src="11_Godot项目/茶园物语/assets/15_茶村配景与入口/DEC_455_连贯低矮叶团_v002.png" alt="连贯低矮叶团 · 放大配景"></a><p>连贯低矮叶团 · 放大配景</p></article></div><script>const after="11_Godot项目/茶园物语/docs/茶村配景与入口调整/village.png";const before="11_Godot项目/茶园物语/docs/动效调整/village_motion.png";for(const id of ['after','before']){document.getElementById(id).onclick=()=>{document.getElementById('picture').src=id==='after'?after:before;document.getElementById('after').setAttribute('aria-pressed',id==='after');document.getElementById('before').setAttribute('aria-pressed',id==='before');}}document.getElementById('zoom').onclick=()=>{const zoomed=document.getEleme
